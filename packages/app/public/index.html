<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120f1a" />
    <title>Portale</title>
    <style>
      :root {
        --bg: #120f1a;
        --panel: #1b1726;
        --edge: #2e2740;
        --ink: #e8e3f2;
        --dim: #9a91b4;
        --gold: #d8a657;
        --blood: #c4574f;
        --ok: #7fa860;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.55 ui-serif, Georgia, "Times New Roman", serif;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--edge);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--panel);
      }
      h1 { font-size: 15px; margin: 0; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
      #vitals { margin-left: auto; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
      #hp { color: var(--ok); font-weight: 600; }
      #hp.hurt { color: var(--blood); }
      #mode {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
        border: 1px solid var(--edge); border-radius: 99px; padding: 2px 9px; color: var(--dim);
      }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
      .line { max-width: 62ch; }
      .dm { color: var(--ink); }
      .you { color: var(--gold); font-style: italic; }
      .you::before { content: "› "; opacity: 0.6; }
      .roll {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px; color: var(--dim);
        border-left: 2px solid var(--gold); padding-left: 10px;
      }
      .mech { font-size: 14px; color: var(--blood); }
      .ruled { font-size: 13px; color: var(--dim); font-style: italic; opacity: 0.85; }
      #cast { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 10px; }
      .npc {
        font-size: 12px; border: 1px solid var(--edge); border-radius: 99px;
        padding: 3px 10px; color: var(--dim);
      }
      .npc.dead { text-decoration: line-through; opacity: 0.45; }
      #vows { padding: 10px 16px; border-bottom: 1px solid var(--edge); background: #17131f; }
      #vows[hidden] { display: none; }
      .vow { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink); }
      .vow .what { flex: 1; min-width: 0; }
      .vow .boxes { display: flex; gap: 2px; flex-shrink: 0; }
      .vow .box { width: 7px; height: 13px; border: 1px solid var(--edge); border-radius: 1px; }
      .vow .box.on { background: var(--gold); border-color: var(--gold); }
      .vow.done .what { color: var(--gold); }
      .vow .rank { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); }
      .line.vow { font-size: 12px; color: var(--gold); opacity: 0.8; font-variant-numeric: tabular-nums; }
      .line.vowdone {
        color: var(--gold); font-weight: 600;
        border-left: 2px solid var(--gold); padding-left: 10px;
      }
      #exits { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 10px; align-items: center; }
      #clocks { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 16px 10px; }
      .clock { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); }
      .clock .pips { display: flex; gap: 3px; }
      .clock .pip {
        width: 9px; height: 9px; border-radius: 2px;
        border: 1px solid var(--edge); background: transparent;
      }
      .clock.danger .pip.on { background: var(--blood); border-color: var(--blood); }
      .clock.progress .pip.on { background: var(--ok); border-color: var(--ok); }
      .clock.done { opacity: 0.55; }
      .line.clock { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
      .line.clockdone {
        color: var(--gold); font-style: italic;
        border-left: 2px solid var(--gold); padding-left: 10px;
      }
      .line.clue {
        color: var(--ok); border-left: 2px solid var(--ok); padding-left: 10px;
      }
      #leads { padding: 0 16px 10px; }
      #leads .label {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
        color: var(--dim); display: block; margin-bottom: 5px;
      }
      .lead {
        font-size: 12px; color: var(--ok); opacity: 0.85;
        padding: 3px 0 3px 10px; border-left: 1px solid var(--edge);
      }
      .exit {
        font-size: 12px; background: none; border: 1px solid var(--gold); color: var(--gold);
        border-radius: 99px; padding: 5px 12px; cursor: pointer; font-family: inherit;
        letter-spacing: 0.04em; min-height: 30px;
      }
      .exit:disabled { opacity: 0.35; cursor: default; }
      #exits .label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
      #mapwrap { padding: 0 16px 10px; }
      #mapwrap[hidden] { display: none; }
      #map { width: 100%; height: 108px; display: block; }
      .room { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
      .room.here { fill: #2b2340; stroke: var(--gold); stroke-width: 2; }
      .roomlabel { fill: var(--dim); font-size: 7px; font-family: ui-sans-serif, system-ui, sans-serif; }
      .room.here + .roomlabel { fill: var(--gold); }
      .link { stroke: var(--edge); stroke-width: 1.5; }
      .stub { stroke: var(--edge); stroke-width: 1.5; stroke-dasharray: 2 2; opacity: 0.7; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--edge); background: var(--panel); }
      input {
        flex: 1; background: var(--bg); border: 1px solid var(--edge); border-radius: 10px;
        color: var(--ink); padding: 13px 14px; font: inherit; font-size: 16px; min-width: 0;
      }
      input:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
      button {
        background: var(--gold); color: #2a1e08; border: 0; border-radius: 10px;
        padding: 0 18px; font: inherit; font-weight: 700; cursor: pointer; min-height: 46px;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      #thinking { padding: 0 16px 12px; color: var(--dim); font-style: italic; font-size: 14px; }
      #ending {
        padding: 16px; border-top: 1px solid var(--edge); background: var(--panel);
        display: flex; flex-direction: column; gap: 10px;
      }
      #ending h2 { margin: 0; font-size: 18px; color: var(--gold); letter-spacing: 0.06em; }
      body[data-outcome="lost"] #ending h2 { color: var(--blood); }
      #ending p { margin: 0; color: var(--dim); font-size: 14px; }
      #ending .again { display: flex; flex-direction: column; gap: 8px; }
      #ending .again button.quiet { background: none; border: 1px solid var(--gold); color: var(--gold); }
      body[data-screen="title"] > :not(header):not(#title):not(script) { display: none !important; }
      body[data-screen="title"] #mode, body[data-screen="title"] #vitals { visibility: hidden; }
      #menu {
        min-height: 30px; padding: 0 12px; font-size: 12px; letter-spacing: 0.08em;
        background: none; border: 1px solid var(--edge); color: var(--dim);
      }
      #title { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }
      #title .tagline { margin: 0 0 8px; color: var(--dim); font-style: italic; }
      #title h2 { margin: 14px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); font-weight: 600; }
      #title button.quiet { background: none; border: 1px solid var(--gold); color: var(--gold); }
      #seeded { display: flex; gap: 8px; padding: 0; border: 0; background: none; }
      #saves { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .save { display: flex; align-items: center; gap: 8px; border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px; }
      .save .about { flex: 1; min-width: 0; font-size: 14px; }
      .save .about small { display: block; color: var(--dim); font-size: 12px; }
      .save.won .about small { color: var(--gold); }
      .save.lost .about small { color: var(--blood); }
      .save button { min-height: 36px; padding: 0 12px; font-size: 13px; }
      .save button.delete { background: none; border: 1px solid var(--edge); color: var(--dim); }
      .save button.delete.armed { border-color: var(--blood); color: var(--blood); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body data-screen="game">
    <header>
      <h1>Portale</h1>
      <span id="mode" data-testid="mode">exploration</span>
      <span id="vitals">hp <span id="hp" data-testid="hp">—</span></span>
      <button type="button" id="menu" data-testid="menu">Tales</button>
    </header>

    <section id="title" data-testid="title" hidden>
      <p class="tagline">A solo tale, told by a Dungeon Master who cannot cheat you.</p>
      <button type="button" id="continue" data-testid="continue" hidden></button>
      <h2>Begin a new tale</h2>
      <button type="button" id="new-lantern" data-testid="new-lantern">The Drowned Lantern</button>
      <button type="button" id="new-delve" data-testid="new-delve" class="quiet">A new delve into the undercroft</button>
      <form id="seeded" data-testid="seeded">
        <input id="seed-input" data-testid="seed-input" inputmode="numeric" autocomplete="off" placeholder="Delve seed" aria-label="Delve seed" />
        <button type="submit" data-testid="new-seeded-delve" class="quiet">Descend</button>
      </form>
      <h2 id="saves-heading" hidden>Your tales</h2>
      <ul id="saves" data-testid="saves"></ul>
    </section>

    <div id="vows" data-testid="vows" hidden></div>
    <div id="log" data-testid="log" aria-live="polite"></div>
    <div id="mapwrap" data-testid="mapwrap" hidden>
      <svg id="map" data-testid="map" role="img" aria-label="Map of where you have been"></svg>
    </div>
    <div id="cast" data-testid="cast"></div>
    <div id="clocks" data-testid="clocks"></div>
    <div id="leads" data-testid="leads" hidden></div>
    <div id="exits" data-testid="exits"></div>
    <div id="thinking" data-testid="thinking" hidden>The DM considers…</div>

    <section id="ending" data-testid="ending" hidden>
      <h2 id="ending-title" data-testid="ending-title"></h2>
      <p id="ending-text" data-testid="ending-text"></p>
      <div class="again">
        <button type="button" id="again-lantern" data-testid="again-lantern">Return to the Drowned Lantern</button>
        <button type="button" id="again-delve" data-testid="again-delve" class="quiet">Descend into a new delve</button>
      </div>
    </section>

    <form id="act" data-testid="act">
      <input
        id="utterance"
        data-testid="utterance"
        placeholder="What do you do?  (start with // to ask the DM a question)"
        autocomplete="off"
        aria-label="What do you do? Start a line with two slashes to speak to the DM out of character."
      />
      <button type="submit" data-testid="send">Act</button>
    </form>

    <script type="module">
      const $ = (s) => document.querySelector(s);
      const log = $('#log');
      const cast = $('#cast');
      const clocks = $('#clocks');
      const vowsEl = $('#vows');
      const leadsEl = $('#leads');
      const exits = $('#exits');
      const mapwrap = $('#mapwrap');
      const mapEl = $('#map');
      const thinking = $('#thinking');
      const titleEl = $('#title');
      const continueEl = $('#continue');
      const savesEl = $('#saves');
      const ending = $('#ending');
      const form = $('#act');
      const input = $('#utterance');
      const send = form.querySelector('button');

      let sessionId = localStorage.getItem('portale.session');

      /** Grid offsets per direction. Vertical and threshold moves get a diagonal nudge. */
      const STEP = {
        north: [0, -1], south: [0, 1], east: [1, 0], west: [-1, 0],
        up: [1, -1], down: [-1, 1], in: [1, 1], out: [-1, -1],
      };

      function layout(rooms) {
        const byId = new Map(rooms.map((r) => [r.id, r]));
        const at = new Map();
        const start = rooms.find((r) => r.here) ?? rooms[0];
        if (!start) return at;

        // Breadth first from where the player stands, following only known exits, so the
        // room they are in anchors the drawing. Collisions nudge sideways; this is a
        // sketch of the space, not a survey.
        const queue = [start.id];
        at.set(start.id, [0, 0]);
        while (queue.length > 0) {
          const id = queue.shift();
          const [x, y] = at.get(id);
          for (const ex of byId.get(id)?.exits ?? []) {
            if (ex.to === null || at.has(ex.to) || !byId.has(ex.to)) continue;
            const [dx, dy] = STEP[ex.dir] ?? [1, 0];
            let nx = x + dx;
            let ny = y + dy;
            while ([...at.values()].some(([ax, ay]) => ax === nx && ay === ny)) nx += 1;
            at.set(ex.to, [nx, ny]);
            queue.push(ex.to);
          }
        }
        for (const r of rooms) if (!at.has(r.id)) at.set(r.id, [at.size, 0]);
        return at;
      }

      function renderMap(rooms) {
        mapwrap.hidden = rooms.length < 2;
        if (rooms.length < 2) return;

        const at = layout(rooms);
        const xs = [...at.values()].map(([x]) => x);
        const ys = [...at.values()].map(([, y]) => y);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);

        const cw = 54, ch = 26, gap = 20;
        const w = (maxX - minX + 1) * (cw + gap) + gap;
        const h = (maxY - minY + 1) * (ch + gap) + gap;
        const px = (x) => (x - minX) * (cw + gap) + gap;
        const py = (y) => (y - minY) * (ch + gap) + gap;

        const parts = [];
        for (const room of rooms) {
          const [x, y] = at.get(room.id);
          const cx = px(x) + cw / 2, cy = py(y) + ch / 2;
          for (const ex of room.exits) {
            const [dx, dy] = STEP[ex.dir] ?? [1, 0];
            if (ex.to !== null) {
              parts.push(`<line class="link" x1="${cx}" y1="${cy}" x2="${cx + dx * (cw + gap) / 2}" y2="${cy + dy * (ch + gap) / 2}" />`);
            } else {
              parts.push(`<line class="stub" x1="${cx}" y1="${cy}" x2="${cx + dx * 13}" y2="${cy + dy * 13}" />`);
            }
          }
        }
        for (const room of rooms) {
          const [x, y] = at.get(room.id);
          const short = room.name.replace(/^The\s+/i, '').slice(0, 11);
          parts.push(
            `<rect class="room${room.here ? ' here' : ''}" x="${px(x)}" y="${py(y)}" width="${cw}" height="${ch}" rx="4" />` +
            `<text class="roomlabel" x="${px(x) + cw / 2}" y="${py(y) + ch / 2 + 2.5}" text-anchor="middle">${short}</text>`,
          );
        }

        mapEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
        mapEl.innerHTML = parts.join('');
      }

      function line(kind, text) {
        const el = document.createElement('div');
        el.className = `line ${kind}`;
        el.dataset.kind = kind;
        el.textContent = text;
        log.append(el);
        log.scrollTop = log.scrollHeight;
      }

      function render(view) {
        log.replaceChildren();
        for (const l of view.transcript) line(l.kind, l.text);

        $('#hp').textContent = `${view.you.hp.now}/${view.you.hp.max}`;
        $('#hp').classList.toggle('hurt', view.you.hp.now <= view.you.hp.max / 2);
        $('#mode').textContent = view.you.defeated ? 'defeated' : view.mode;
        document.body.dataset.seq = String(view.seq);
        document.body.dataset.mode = view.mode;
        document.body.dataset.outcome = view.outcome;

        const over = view.outcome !== 'playing';
        ending.hidden = !over;
        form.hidden = over;
        if (over) {
          const kept = view.vows.filter((v) => v.done).map((v) => v.what);
          $('#ending-title').textContent = view.outcome === 'won' ? 'Sworn and done' : 'You have fallen';
          $('#ending-text').textContent =
            view.outcome === 'won' ? `${kept.join('. ')}. The tale is yours.` : 'The tale ends here, and the dark keeps what it took.';
        }

        cast.replaceChildren();
        for (const n of view.present) {
          const el = document.createElement('span');
          el.className = `npc${n.dead ? ' dead' : ''}`;
          el.dataset.testid = `npc-${n.id}`;
          el.textContent = `${n.name} ${n.hp.now}/${n.hp.max}`;
          cast.append(el);
        }

        vowsEl.replaceChildren();
        vowsEl.hidden = view.vows.length === 0;
        for (const v of view.vows) {
          const el = document.createElement('div');
          el.className = `vow${v.done ? ' done' : ''}`;
          el.dataset.testid = `vow-${v.id}`;
          el.dataset.boxes = String(v.boxes);

          const what = document.createElement('span');
          what.className = 'what';
          what.textContent = v.done ? `${v.what} — kept` : v.what;

          const rank = document.createElement('span');
          rank.className = 'rank';
          rank.textContent = v.rank;

          const boxes = document.createElement('span');
          boxes.className = 'boxes';
          for (let i = 0; i < 10; i++) {
            const b = document.createElement('span');
            b.className = `box${i < v.boxes ? ' on' : ''}`;
            boxes.append(b);
          }

          el.append(what, rank, boxes);
          vowsEl.append(el);
        }

        clocks.replaceChildren();
        for (const c of view.clocks) {
          const el = document.createElement('div');
          el.className = `clock ${c.kind}${c.done ? ' done' : ''}`;
          el.dataset.testid = `clock-${c.id}`;
          el.dataset.filled = String(c.filled);

          const pips = document.createElement('span');
          pips.className = 'pips';
          for (let i = 0; i < c.segments; i++) {
            const p = document.createElement('span');
            p.className = `pip${i < c.filled ? ' on' : ''}`;
            pips.append(p);
          }
          const name = document.createElement('span');
          name.textContent = c.name;

          el.append(pips, name);
          clocks.append(el);
        }

        leadsEl.replaceChildren();
        leadsEl.hidden = view.leads.length === 0;
        if (view.leads.length > 0) {
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = `what you know (${view.leads.length})`;
          leadsEl.append(label);
          for (const l of view.leads) {
            const el = document.createElement('div');
            el.className = 'lead';
            el.dataset.testid = `lead-${l.id}`;
            el.textContent = l.what;
            leadsEl.append(el);
          }
        }

        exits.replaceChildren();
        if (view.exits.length > 0 && view.outcome === 'playing') {
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = 'ways out';
          exits.append(label);
          for (const dir of view.exits) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'exit';
            b.dataset.testid = `exit-${dir}`;
            b.textContent = dir;
            b.disabled = view.mode === 'combat' || view.you.defeated;
            b.addEventListener('click', () => act(`I go ${dir}.`));
            exits.append(b);
          }
        }

        renderMap(view.map);
      }

      async function api(path, init) {
        const res = await fetch(path, {
          ...init,
          headers: { 'Content-Type': 'application/json', ...(init?.headers ?? {}) },
        });
        if (!res.ok) throw Object.assign(new Error(`${res.status} ${await res.text()}`), { status: res.status });
        return res.status === 204 ? null : res.json();
      }

      async function boot() {
        // ?scenario=delve starts a generated dungeon; ?seed=N makes it reproducible. The link
        // that started a session resumes it, so reloading a delve does not restart the dungeon.
        const params = new URLSearchParams(location.search);
        const wanted = params.get('scenario');
        const wantedSeed = params.get('seed');
        const linked = wanted !== null || wantedSeed !== null;
        const fresh = linked && localStorage.getItem('portale.origin') !== location.search;

        if (sessionId && !fresh) {
          try {
            const { view } = await api(`/api/session/${sessionId}`);
            render(view);
            showGame();
            return;
          } catch {
            localStorage.removeItem('portale.session');
            sessionId = null;
          }
        }

        if (!linked) return showTitle();

        const body = {};
        if (wanted !== null) body.scenario = wanted;
        if (wantedSeed !== null) body.seed = Number(wantedSeed);
        await startSession(body);
      }

      async function startSession(body) {
        const { id, view } = await api('/api/session', { method: 'POST', body: JSON.stringify(body) });
        sessionId = id;
        localStorage.setItem('portale.session', id);
        localStorage.setItem('portale.origin', location.search);
        render(view);
        showGame();
      }

      /** A new tale from a menu. The old link is dropped so a reload resumes this one. */
      async function again(body) {
        history.replaceState(null, '', location.pathname);
        await startSession(body);
      }

      async function resume(id) {
        history.replaceState(null, '', location.pathname);
        const { view } = await api(`/api/session/${id}`);
        sessionId = id;
        localStorage.setItem('portale.session', id);
        localStorage.setItem('portale.origin', '');
        render(view);
        showGame();
      }

      function showGame() {
        document.body.dataset.screen = 'game';
        titleEl.hidden = true;
      }

      async function showTitle() {
        // Fetched before the screen switches, so the title never shows a half-built list.
        let sessions = [];
        let failure = null;
        try {
          ({ sessions } = await api('/api/sessions'));
        } catch (err) {
          failure = err;
        }

        savesEl.replaceChildren();
        if (failure !== null) savesEl.textContent = `The table cannot be reached. ${failure.message}`;

        const latest = sessions.find((s) => s.outcome === 'playing');
        continueEl.hidden = latest === undefined;
        if (latest !== undefined) {
          continueEl.textContent = `Continue ${latest.title} · ${latest.turns} ${latest.turns === 1 ? 'turn' : 'turns'}`;
          continueEl.onclick = () => void resume(latest.id);
        }

        $('#saves-heading').hidden = sessions.length === 0;
        for (const s of sessions) {
          const li = document.createElement('li');
          li.className = `save ${s.outcome}`;
          li.dataset.testid = `save-${s.id}`;

          const about = document.createElement('span');
          about.className = 'about';
          about.textContent = s.scenario === 'delve' ? `${s.title} · seed ${s.seed}` : s.title;
          const status = document.createElement('small');
          const state = s.outcome === 'won' ? 'won' : s.outcome === 'lost' ? 'lost' : 'in progress';
          status.textContent = `${state} · ${s.turns} ${s.turns === 1 ? 'turn' : 'turns'}`;
          about.append(status);

          const open = document.createElement('button');
          open.type = 'button';
          open.dataset.testid = `resume-${s.id}`;
          open.textContent = s.outcome === 'playing' ? 'Resume' : 'Read';
          open.addEventListener('click', () => void resume(s.id));

          // Two taps, because a deleted tale cannot be brought back and a dialog would stall the page.
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'delete';
          del.dataset.testid = `delete-${s.id}`;
          del.textContent = 'Delete';
          del.addEventListener('click', async () => {
            if (!del.classList.contains('armed')) {
              del.classList.add('armed');
              del.textContent = 'Delete?';
              return;
            }
            await api(`/api/session/${s.id}`, { method: 'DELETE' });
            if (sessionId === s.id) {
              localStorage.removeItem('portale.session');
              sessionId = null;
            }
            await showTitle();
          });

          li.append(about, open, del);
          savesEl.append(li);
        }

        document.body.dataset.screen = 'title';
        titleEl.hidden = false;
      }

      $('#again-lantern').addEventListener('click', () => void again({ scenario: 'lantern' }));
      $('#again-delve').addEventListener('click', () => void again({ scenario: 'delve', seed: Math.floor(Math.random() * 0xffffffff) }));
      $('#new-lantern').addEventListener('click', () => void again({ scenario: 'lantern' }));
      $('#new-delve').addEventListener('click', () => void again({ scenario: 'delve', seed: Math.floor(Math.random() * 0xffffffff) }));
      $('#seeded').addEventListener('submit', (e) => {
        e.preventDefault();
        const n = Number($('#seed-input').value.trim());
        if (Number.isFinite(n) && $('#seed-input').value.trim() !== '') void again({ scenario: 'delve', seed: n });
      });
      $('#menu').addEventListener('click', () => {
        if (!document.body.dataset.busy) void showTitle();
      });

      async function act(utterance) {
        if (!utterance || send.disabled) return;

        line('you', utterance);
        input.value = '';
        send.disabled = true;
        thinking.hidden = false;
        document.body.dataset.busy = 'true';

        try {
          const result = await api(`/api/session/${sessionId}/turn`, {
            method: 'POST',
            body: JSON.stringify({ utterance }),
          });
          render(result.view);
          if (result.softFail) line('ruled', 'Nothing came of that. Try saying it another way.');
        } catch (err) {
          // A 409 means the table moved on without this tab, because the tale ended or another
          // turn is being told, so show what is true now rather than an error.
          if (err.status === 409) render((await api(`/api/session/${sessionId}`)).view);
          else line('ruled', `The connection to the table failed. ${err.message}`);
        } finally {
          send.disabled = false;
          thinking.hidden = true;
          delete document.body.dataset.busy;
          input.focus();
        }
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        void act(input.value.trim());
      });

      boot().catch((e) => line('ruled', `Could not start a session. ${e.message}`));
    </script>
  </body>
</html>
